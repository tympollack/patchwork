name = "patchwork-upload-processor"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Public environment variables
[vars]
R2_BUCKET_NAME = "patchwork-ports-stag"
WEBHOOK_URL = "" # Webhook target for critter bounties (e.g. https://api.patchwork.org/webhook/critter-bounty)
ALLOWED_ORIGINS = "*" # Set specific comma-separated origins for web clients (e.g. "https://patchwork.app,http://localhost:8081")
REQUIRE_HARDWARE_ATTESTATION = "false" # Set "true" to require valid x-device-attestation header on upload requests

# R2 bucket bindings
# Secrets (SUPABASE_URL, SUPABASE_SERVICE_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, CRON_SECRET) set via: wrangler secret put

[[r2_buckets]]
binding    = "R2_STAGING"
bucket_name = "patchwork-ports-stag"

[[r2_buckets]]
binding    = "R2_PRODUCTION"
bucket_name = "patchwork-ports"

# Cloudflare Queues consumer for R2 upload processing
# Staging bucket events (object-create) route into this queue via:
#   wrangler r2 bucket notification create patchwork-ports-stag --event-type object-create --queue patchwork-upload-queue
[[queues.consumers]]
queue        = "patchwork-upload-queue"
max_batch_size    = 10
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "patchwork-upload-dlq"

# Native Cron Triggers (bypasses external cron-job.org and Render)
[triggers]
crons = ["5 0 * * *", "10 0 * * *"]
